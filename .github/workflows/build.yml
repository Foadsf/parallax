name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-test:
    # The reconstruction core on the host: renders a synthetic rig scan with ground truth and
    # checks registration, pose error, metric scale, gravity and dense surface error.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopencv-dev cmake g++
      - name: Build
        run: cmake -S tools/host-test -B build/host-test && cmake --build build/host-test -j
      - name: Single camera, sparse
        run: build/host-test/synth_test "$RUNNER_TEMP/single" 36 --single --no-dense
      - name: Two-camera rig, dense
        run: build/host-test/synth_test "$RUNNER_TEMP/rig" 36

  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install the pinned Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      - name: Build
        run: ./gradlew assembleRelease

      - name: No network permission
        run: |
          perms=$("$ANDROID_HOME/build-tools/37.0.0/aapt2" dump permissions app/build/outputs/apk/release/app-release.apk)
          echo "$perms"
          ! echo "$perms" | grep -q 'android.permission.INTERNET'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parallax-apk
          path: app/build/outputs/apk/release/app-release.apk
